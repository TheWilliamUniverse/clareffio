name: Import Clareffio codebase

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Import exact Clareffio snapshot
        run: |
          git clone --quiet https://github.com/TheWilliamUniverse/greffio.git /tmp/clareffio-source
          cd /tmp/clareffio-source
          git checkout --quiet 628becfb942ac46830b5c0c2030f47306224f327
          cd "$GITHUB_WORKSPACE"
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/clareffio-source/ ./
          rm -f .clareffio-import-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import Clareffio from Greffio migration snapshot'
          git push origin HEAD:main
