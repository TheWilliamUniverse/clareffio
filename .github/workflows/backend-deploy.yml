name: Clareffio Backend Deploy — protected

# Safety guard for the Greffio -> Clareffio split.
# Clareffio must not deploy into /opt/greffio or restart greffio-api.
# Re-enable this workflow only after a distinct Clareffio target, PM2 service,
# environment and secrets have been provisioned and verified.

on:
  workflow_dispatch:

jobs:
  protected-until-infrastructure-split:
    runs-on: ubuntu-latest
    steps:
      - name: Deployment intentionally blocked
        run: |
          echo "Clareffio backend deployment is intentionally blocked."
          echo "Provision a distinct Clareffio deployment target before enabling this workflow."
          echo "The existing /opt/greffio and greffio-api production service must remain untouched."
          exit 1
